<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" fill="none" role="img" aria-label="Wager milestone medals">
  <defs>
    <linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b6bd0"/><stop offset="1" stop-color="#4c3480"/></linearGradient>
    <linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd066"/><stop offset=".55" stop-color="#f0a92c"/><stop offset="1" stop-color="#b9761a"/></linearGradient>
    <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd4f5"/><stop offset="1" stop-color="#2b86bd"/></linearGradient>
    <linearGradient id="rp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b4ea8"/><stop offset="1" stop-color="#3a2765"/></linearGradient>
    <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0a92c"/><stop offset="1" stop-color="#9c5f12"/></linearGradient>
    <linearGradient id="rb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b86bd"/><stop offset="1" stop-color="#175a85"/></linearGradient>
  </defs>

  <!-- left medal (purple) -->
  <g opacity=".92">
    <path d="M46 118 L34 186 L58 172 L74 190 L84 124 Z" fill="url(#rp)"/>
    <circle cx="65" cy="98" r="38" fill="url(#gp)"/>
    <circle cx="65" cy="98" r="38" fill="none" stroke="#b49ae8" stroke-width="2" stroke-opacity=".5"/>
    <circle cx="65" cy="98" r="27" fill="none" stroke="#0a0f1f" stroke-opacity=".28" stroke-width="3" stroke-dasharray="7 5"/>
    <circle cx="65" cy="98" r="16" fill="#efe6ff" fill-opacity=".9"/>
    <path d="M65 89l3.1 6.6 7.1.9-5.2 5 1.3 7.1-6.3-3.4-6.3 3.4 1.3-7.1-5.2-5 7.1-.9z" fill="#5a3f96"/>
  </g>

  <!-- right medal (blue) -->
  <g opacity=".92">
    <path d="M236 124 L246 190 L262 172 L286 186 L274 118 Z" fill="url(#rb)"/>
    <circle cx="255" cy="98" r="38" fill="url(#gb)"/>
    <circle cx="255" cy="98" r="38" fill="none" stroke="#a9e4fb" stroke-width="2" stroke-opacity=".5"/>
    <circle cx="255" cy="98" r="27" fill="none" stroke="#0a0f1f" stroke-opacity=".28" stroke-width="3" stroke-dasharray="7 5"/>
    <circle cx="255" cy="98" r="16" fill="#e8f8ff" fill-opacity=".9"/>
    <path d="M255 89l3.1 6.6 7.1.9-5.2 5 1.3 7.1-6.3-3.4-6.3 3.4 1.3-7.1-5.2-5 7.1-.9z" fill="#1f6d9e"/>
  </g>

  <!-- centre medal (gold) -->
  <g>
    <path d="M136 112 L120 200 L152 182 L170 204 L186 112 Z" fill="url(#rg)"/>
    <circle cx="160" cy="86" r="50" fill="url(#gg)"/>
    <circle cx="160" cy="86" r="50" fill="none" stroke="#ffe6a8" stroke-width="2.5" stroke-opacity=".55"/>
    <circle cx="160" cy="86" r="36" fill="none" stroke="#0a0f1f" stroke-opacity=".3" stroke-width="4" stroke-dasharray="9 6"/>
    <circle cx="160" cy="86" r="22" fill="#fff8e6"/>
    <path d="M160 74l4.2 8.9 9.6 1.2-7 6.7 1.8 9.6-8.6-4.6-8.6 4.6 1.8-9.6-7-6.7 9.6-1.2z" fill="#b9761a"/>
  </g>
</svg>
