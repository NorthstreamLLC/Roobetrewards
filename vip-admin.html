<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>VIP Transfers — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f1f;--sunk:#0c1223;--surface:#111a33;--surface-2:#141e3a;--surface-3:#182444;
  --gold:#f5a524;--text:#eef1f7;--mid:#c3cad8;--dim:#8b93a7;--faint:#6b7488;
  --line:rgba(255,255,255,.07);--mono:'JetBrains Mono',ui-monospace,monospace;
  --green:#35d39a;--blue:#7b8cff;--red:#ff6b6b;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit}
.wrap{max-width:1680px;margin:0 auto;padding:26px clamp(14px,2vw,30px) 70px}

/* header */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--gold)}
.sub{font-size:12.5px;color:var(--faint);margin-top:2px}
.home{font-size:12.5px;color:var(--dim);text-decoration:none}
.home:hover{color:var(--gold)}

/* gate */
.gate{max-width:380px;margin:14vh auto;background:var(--surface);border:1px solid var(--line);
  border-radius:15px;padding:30px}
.gate h2{font-size:1.15rem;font-weight:800;margin-bottom:6px}
.gate p{font-size:13px;color:var(--dim);margin-bottom:18px}

/* controls */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--text);background:var(--sunk);
  border:1px solid var(--line);border-radius:9px;padding:10px 12px;outline:none;transition:border-color .16s}
input:focus,select:focus,textarea:focus{border-color:rgba(245,165,36,.5)}
input::placeholder{color:var(--faint)}
.bar input[type=search]{min-width:250px}
button{font-family:inherit;font-size:13px;font-weight:600;border-radius:9px;cursor:pointer;
  padding:10px 15px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);transition:.16s}
button:hover{border-color:rgba(245,165,36,.4)}
button.gold{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:700}
button.gold:hover{background:#ffc46b}
button.danger:hover{border-color:var(--red);color:var(--red)}
button.link{background:none;border:none;padding:6px 8px;color:var(--faint)}
button.link:hover{color:var(--gold)}

/* counts */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tab{font-size:12.5px;padding:8px 13px;border-radius:8px;border:1px solid var(--line);
  background:none;color:var(--dim)}
.tab.on{background:rgba(245,165,36,.11);border-color:rgba(245,165,36,.4);color:var(--gold)}
.tab b{font-family:var(--mono);font-weight:500;opacity:.7;margin-left:5px}

/* table */
.tbl-wrap{border:1px solid var(--line);border-radius:14px;overflow-x:auto;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:1180px}
th{background:var(--sunk);padding:13px 14px;text-align:left;white-space:nowrap;
  font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--faint);font-weight:600}
td{padding:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--mid);vertical-align:top}
tr:hover td{background:rgba(255,255,255,.014)}
.id{font-family:var(--mono);font-size:11.5px;color:var(--faint);white-space:nowrap}
.name{font-weight:700;color:var(--text)}
.muted{color:var(--faint)}
.copy{background:none;border:none;color:var(--faint);cursor:pointer;padding:0 0 0 5px;font-size:11px}
.copy:hover{color:var(--gold)}
.when{font-family:var(--mono);font-size:11.5px;color:var(--faint);white-space:nowrap}
.code{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;
  padding:2px 6px;border-radius:5px;background:rgba(245,165,36,.12);color:var(--gold);margin-left:6px}

/* shots */
.shots{display:flex;flex-wrap:wrap;gap:6px;max-width:210px}
.shots a{display:block;width:62px;height:62px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.shots a:hover{border-color:var(--gold)}
.shots img{width:100%;height:100%;object-fit:cover;display:block}
.shots .lbl{width:100%;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);margin-top:2px}

/* status */
select.st{padding:7px 10px;font-size:12.5px;font-weight:700;border-radius:7px}
select.st[data-s=pending]{color:var(--gold);border-color:rgba(245,165,36,.4)}
select.st[data-s=in_review]{color:var(--blue);border-color:rgba(123,140,255,.4)}
select.st[data-s=completed]{color:var(--green);border-color:rgba(53,211,154,.45)}
select.st[data-s=rejected]{color:var(--red);border-color:rgba(255,107,107,.4)}

.notes{width:100%;min-width:170px;font-size:12.5px;resize:vertical}
.saved{font-size:11px;color:var(--green);margin-top:4px;height:13px}

.empty{padding:56px 20px;text-align:center;color:var(--faint);font-size:14px}
.err{margin-bottom:14px;padding:11px 14px;border-radius:9px;font-size:13px;
  background:rgba(255,90,90,.1);border:1px solid rgba(255,110,110,.34);color:#ffb3b3}
.foot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  margin-top:14px;font-size:12.5px;color:var(--faint)}
</style>
</head>
<body>

<!-- ============ key gate ============ -->
<div class="gate" id="gate">
  <h2>VIP Transfers</h2>
  <p>Enter the admin key to load requests.</p>
  <input id="key" type="password" placeholder="VIP_ADMIN_KEY" style="width:100%" autocomplete="current-password">
  <div style="display:flex;gap:8px;margin-top:14px">
    <button class="gold" id="go" style="flex:1">Unlock</button>
  </div>
  <p class="err" id="gate-err" style="margin:14px 0 0;display:none"></p>
</div>

<!-- ============ panel ============ -->
<div class="wrap" id="panel" hidden>
  <header>
    <div>
      <h1>VIP <span>Transfers</span></h1>
      <p class="sub">Admin panel &middot; <span id="stamp">—</span></p>
    </div>
    <a class="home" href="/vip-transfer">&larr; back to the public page</a>
  </header>

  <div class="bar">
    <input id="q" type="search" placeholder="Search username, casino, Discord…">
    <select id="sort">
      <option value="new">Newest first</option>
      <option value="old">Oldest first</option>
      <option value="name">Roobet username A–Z</option>
    </select>
    <button id="refresh">Refresh</button>
    <button id="csv">Export CSV</button>
    <div class="tabs" id="tabs"></div>
  </div>

  <p class="err" id="err" style="display:none"></p>

  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>ID</th><th>Roobet Username</th><th>Previous Casino</th>
        <th>Discord</th><th>Telegram</th><th>Screenshots</th>
        <th>Status</th><th>Admin Notes</th><th>Created</th><th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No requests yet.</div>
  </div>

  <div class="foot">
    <span id="showing">—</span>
    <span>Screenshots open full size in a new tab.</span>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let KEY = '', DATA = [], filter = 'all';

const STATUS = [
  ['pending', 'Pending'], ['in_review', 'In review'],
  ['completed', 'Completed'], ['rejected', 'Rejected']
];

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const when = ms => {
  const d = new Date(ms);
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() +
         ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
};

// ---------- auth ----------
$('go').addEventListener('click', unlock);
$('key').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
try {
  const saved = sessionStorage.getItem('vipKey');
  if (saved) { $('key').value = saved; unlock(); }
} catch (e) {}

async function unlock() {
  KEY = $('key').value.trim();
  if (!KEY) return;
  $('go').textContent = 'Checking…';
  const ok = await load(true);
  $('go').textContent = 'Unlock';
  if (ok) {
    try { sessionStorage.setItem('vipKey', KEY); } catch (e) {}
    $('gate').hidden = true;
    $('panel').hidden = false;
  }
}

// ---------- data ----------
async function load(quiet) {
  try {
    const r = await fetch('/api/vip-transfer?key=' + encodeURIComponent(KEY), {
      headers: { 'x-admin-key': KEY }
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error === 'forbidden' ? 'Wrong admin key.' : (d.error || 'request failed'));
    DATA = d.requests || [];
    $('stamp').textContent = DATA.length + ' request' + (DATA.length === 1 ? '' : 's') +
      ' · updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    $('err').style.display = 'none';
    tabs(d.counts || {});
    render();
    return true;
  } catch (e) {
    const box = quiet ? $('gate-err') : $('err');
    box.textContent = e.message || String(e);
    box.style.display = 'block';
    return false;
  }
}

function tabs(counts) {
  const all = [['all', 'All']].concat(STATUS);
  $('tabs').innerHTML = all.map(([k, label]) =>
    '<button class="tab' + (filter === k ? ' on' : '') + '" data-f="' + k + '">' +
    label + '<b>' + (counts[k] || 0) + '</b></button>').join('');
  $('tabs').querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    filter = b.dataset.f;
    $('tabs').querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
    render();
  }));
}

function visible() {
  const q = $('q').value.trim().toLowerCase();
  let rows = DATA.filter(r => filter === 'all' || r.status === filter);
  if (q) rows = rows.filter(r =>
    [r.roobet, r.prevCasino, r.discord, r.telegram, r.notes, r.adminNotes, r.id]
      .join(' ').toLowerCase().includes(q));
  const s = $('sort').value;
  rows.sort((a, b) =>
    s === 'old' ? a.created - b.created :
    s === 'name' ? String(a.roobet).localeCompare(String(b.roobet)) :
    b.created - a.created);
  return rows;
}

function shots(r) {
  const grp = (label, arr) => !arr || !arr.length ? '' :
    '<span class="lbl">' + label + '</span>' + arr.map(u =>
      '<a href="' + esc(u) + '" target="_blank" rel="noopener"><img loading="lazy" src="' +
      esc(u) + '" alt=""></a>').join('');
  return '<div class="shots">' + grp('Account + code', r.proof) + grp('Old casino', r.stats) + '</div>';
}

function render() {
  const rows = visible();
  $('empty').hidden = rows.length > 0;
  $('showing').textContent = 'Showing ' + rows.length + ' of ' + DATA.length;
  $('rows').innerHTML = rows.map(r => `
    <tr data-id="${esc(r.id)}">
      <td class="id">${esc(r.id.slice(0, 8))}<button class="copy" data-copy="${esc(r.id)}" title="Copy full ID">⧉</button></td>
      <td><span class="name">${esc(r.roobet)}</span>${r.code ? '<span class="code">' + esc(r.code) + '</span>' : ''}
          ${r.notes ? '<div class="muted" style="font-size:12px;margin-top:5px;max-width:230px">' + esc(r.notes) + '</div>' : ''}</td>
      <td>${esc(r.prevCasino) || '<span class="muted">—</span>'}</td>
      <td>${r.discord ? esc(r.discord) : '<span class="muted">—</span>'}</td>
      <td>${r.telegram ? '@' + esc(r.telegram) : '<span class="muted">—</span>'}</td>
      <td>${shots(r)}</td>
      <td><select class="st" data-s="${esc(r.status)}">
        ${STATUS.map(([v, l]) => '<option value="' + v + '"' + (r.status === v ? ' selected' : '') + '>' + l + '</option>').join('')}
      </select></td>
      <td><textarea class="notes" rows="2" placeholder="Internal notes…">${esc(r.adminNotes)}</textarea>
          <div class="saved"></div></td>
      <td class="when">${when(r.created)}</td>
      <td><button class="link danger" data-del="1" title="Delete">✕</button></td>
    </tr>`).join('');

  $('rows').querySelectorAll('tr').forEach(tr => {
    const id = tr.dataset.id;
    const sel = tr.querySelector('select.st');
    const note = tr.querySelector('textarea.notes');
    const saved = tr.querySelector('.saved');

    sel.addEventListener('change', async () => {
      sel.dataset.s = sel.value;
      await patch({ id, status: sel.value });
      const rec = DATA.find(x => x.id === id);
      if (rec) rec.status = sel.value;
      flash(saved, 'Saved');
    });

    let t;
    note.addEventListener('input', () => {
      clearTimeout(t);
      t = setTimeout(async () => {
        await patch({ id, adminNotes: note.value });
        const rec = DATA.find(x => x.id === id);
        if (rec) rec.adminNotes = note.value;
        flash(saved, 'Saved');
      }, 700);
    });

    tr.querySelector('[data-del]').addEventListener('click', async () => {
      if (!confirm('Delete this request permanently?')) return;
      await fetch('/api/vip-transfer?key=' + encodeURIComponent(KEY) + '&id=' + encodeURIComponent(id),
        { method: 'DELETE', headers: { 'x-admin-key': KEY } });
      DATA = DATA.filter(x => x.id !== id);
      render();
    });

    const cp = tr.querySelector('[data-copy]');
    if (cp) cp.addEventListener('click', () => {
      navigator.clipboard.writeText(cp.dataset.copy);
      cp.textContent = '✓';
      setTimeout(() => (cp.textContent = '⧉'), 1200);
    });
  });
}

function flash(el, msg) {
  el.textContent = msg;
  setTimeout(() => (el.textContent = ''), 1600);
}

async function patch(body) {
  try {
    const r = await fetch('/api/vip-transfer?key=' + encodeURIComponent(KEY), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': KEY },
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'save failed');
  } catch (e) {
    $('err').textContent = e.message || String(e);
    $('err').style.display = 'block';
  }
}

// ---------- controls ----------
$('q').addEventListener('input', render);
$('sort').addEventListener('change', render);
$('refresh').addEventListener('click', () => load());
$('csv').addEventListener('click', () => {
  const rows = visible();
  const head = ['id', 'roobet', 'prevCasino', 'code', 'discord', 'telegram', 'status', 'notes', 'adminNotes', 'created', 'proof', 'stats'];
  const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const csv = [head.join(',')].concat(rows.map(r => head.map(h =>
    cell(h === 'created' ? new Date(r.created).toISOString()
      : Array.isArray(r[h]) ? r[h].join(' | ') : r[h])).join(','))).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'vip-transfers-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
});
</script>
</body>
</html>
